name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Unit tests
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts,android-bridge,native-window -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { $errors | Write-Output; $failed = $true }
          }
          if ($failed) { exit 1 }
