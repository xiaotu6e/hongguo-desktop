[project]
name = "hongguo_desktop"
version = "0.1.8"
description = "Android desktop launcher and APK installer"
requires-python = ">=3.11"
dependencies = ["flet==1.0.1", "flet-dropzone==0.4.0", "apkutils==3.0.0"]

[tool.flet]
org = "local.xiaotu"
product = "红果桌面助手"
company = "本地工具"
copyright = "Personal desktop utility"

[tool.flet.app]
path = "src"

[tool.flet.windows]
executable_name = "hongguo_desktop"
